<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card de Produto | Alessandra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="imagem">
      <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500&h=500&fit=crop" alt="Relógio">
      <span class="tag">Novo</span>
    </div>

    <div class="conteudo">
      <p class="categoria">Acessórios</p>
      <h2>Relógio Minimalista</h2>
      <p class="descricao">Design clean, pulseira de couro e resistência à água. Perfeito para o dia a dia.</p>

      <div class="preco-avaliacao">
        <div class="preco">
          <span class="atual">R$ 249,90</span>
          <span class="antigo">R$ 329,90</span>
        </div>
        <div class="estrelas">★★★★☆</div>
      </div>

      <div class="botoes">
        <button class="btn-comprar">Adicionar ao carrinho</button>
        <button class="btn-favorito">♡</button>
      </div>
    </div>
  </div>
</body>
</html>
